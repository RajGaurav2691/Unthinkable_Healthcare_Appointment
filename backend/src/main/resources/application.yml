spring:
  profiles:
    active: dev
  application:
    name: healthcare-manager
  config:
    import: optional:file:../.env[.properties]

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}
  llm:
    provider: ${LLM_PROVIDER:mock}
    api-url: ${LLM_API_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gemini-1.5-flash}
  email:
    enabled: ${EMAIL_ENABLED:false}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from-email: ${EMAIL_FROM:noreply@example.com}
